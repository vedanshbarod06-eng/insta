<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff"><meta name="description" content="Orbit Social">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css"><title>Orbit Social</title>
</head>
<body>
  <div id="store" class="store-screen">
    <header class="store-top"><span class="play-mark">▶</span><strong>Orbit Store</strong><span class="avatar-small">O</span></header>
    <nav class="store-tabs"><span>For you</span><span>Top charts</span><span>Categories</span></nav>
    <main class="store-content">
      <label class="store-search">⌕ <input id="storeSearch" placeholder="Search apps & games" value="Orbit Social"></label>
      <p class="eyebrow">DISCOVER</p><h1>Explore apps</h1>
      <section class="featured">
        <div class="app-icon">◎</div><div><h2>Orbit Social</h2><p>Social networking · Independent app</p><small>Public profiles · Reels · Insights</small></div>
      </section>
      <button id="openApp" class="primary">Open</button>
      <p class="store-note">An independent social interface prototype. Not affiliated with Instagram or Google Play.</p>
    </main>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="app-header">
      <button class="wordmark" data-page="home">Orbit</button>
      <div class="header-actions"><button aria-label="Search" data-page="explore">⌕</button><button aria-label="Insights" data-page="dashboard">▥</button></div>
    </header>
    <main id="page" class="page"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-page="home" aria-label="Home"><span>⌂</span></button>
      <button data-page="reels" aria-label="Reels"><span>▣</span></button>
      <button data-page="explore" aria-label="Explore"><span>⌕</span></button>
      <button data-page="activity" aria-label="Activity"><span>♡</span></button>
      <button data-page="profile" aria-label="Profile"><span>◉</span></button>
    </nav>
  </div>
  <div id="toast" role="status" class="toast"></div>
  <script src="/app.js"></script>
</body></html>
